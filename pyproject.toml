[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electrolyte-md-workflow"
version = "0.2.0"
description = "Recipe-driven electrolyte MD with Packmol, GAFF2 and OpenMM"
requires-python = ">=3.10"
dependencies = ["numpy", "rdkit", "openmm>=8.2,<9", "MDAnalysis>=2.7,<3"]

[tool.setuptools]
packages = ["electrolyte"]
